name = "deficit-proxy"
main = "worker.js"
compatibility_date = "2025-08-01"

# La clave NO va acá: se carga como secreto con
#   npx wrangler secret put ANTHROPIC_API_KEY
# Un secreto no queda en el repo ni se puede volver a leer desde el dashboard.

# Freno por IP: 30 pedidos por minuto. El análisis de una comida es 1 pedido,
# así que sobra para uso normal y corta cualquier abuso automatizado.
[[unsafe.bindings]]
name = "LIMITE"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# El reloj de los avisos: cada quince minutos mira si a alguien le toca un
# recordatorio. Es lo unico que puede avisar con la app cerrada.
#
# Los otros secretos van igual que la clave de Claude:
#   npx wrangler secret put VAPID_PRIVADA     (la que genera tools/vapid.py)
#   npx wrangler secret put VAPID_PUBLICA
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_ANON
[triggers]
crons = ["*/15 * * * *"]
